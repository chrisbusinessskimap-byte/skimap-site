# Pubblica il sito su GitHub Pages (Settings → Pages → Source: GitHub Actions).
# Scrive assets/config.js con la chiave Web3Forms presa dal secret WEB3FORMS_KEY: la chiave non sta nel repo.
name: Pubblica il sito
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Genera le pagine dai testi in content/
        run: node tools/build.mjs
      - name: Controlli (link, ancore, parità tra le lingue; i [DA CONFERMARE] sono solo avvisi)
        run: node tools/check.mjs
      - name: Scrivi la configurazione del modulo dai secret
        env:
          WEB3FORMS_KEY: ${{ secrets.WEB3FORMS_KEY }}
          FORMSPREE_URL: ${{ secrets.FORMSPREE_URL }}
        run: node tools/write-config.mjs
      - name: Prepara la cartella da pubblicare
        run: |
          mkdir _site
          cp -r index.html come-funziona aree domande en de privacy.html elimina-account.html assets sitemap.xml robots.txt CNAME .nojekyll _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
