<!doctype html><html><head><meta charset=utf-8><link rel=stylesheet href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800&family=Barlow:wght@500&display=swap"><style>:root{--accent:#ffb300;--ink:#101418;--ink-2:#4c5866;--shadow:0 22px 44px -22px rgba(16,20,24,.28)}body{margin:0;padding:30px;background:#e9eef4;font-family:Barlow}.wrap{max-width:1180px;margin:0 auto}/* il bivio: pista stilizzata in prima persona, palo nel mezzo del bivio */
.bivio-intro{text-align:center; max-width:56ch; margin:0 auto 26px}
.bivio-intro p{color:var(--ink-2)}
.bivio{position:relative; height:620px; border-radius:22px; overflow:hidden; background:#d9e6f3; box-shadow:var(--shadow)}
.bivio .scene{position:absolute; inset:0; width:100%; height:100%; display:block}
.signpost{position:absolute; left:33.5%; top:0; width:0; height:100%}
.pole{position:absolute; left:-5px; bottom:26.5%; width:10px; height:238px; background:linear-gradient(90deg,#5d4c3a,#a58963 45%,#5d4c3a); border-radius:3px; box-shadow:5px 10px 16px -6px rgba(16,20,24,.5)}
.pole:after{content:""; position:absolute; left:-9px; bottom:-8px; width:28px; height:12px; background:#fff; border-radius:50%; box-shadow:0 4px 10px -4px rgba(16,20,24,.5)}
.sign{position:absolute; bottom:calc(26.5% + 154px); width:max-content; max-width:min(40vw,330px); background:var(--accent); color:var(--ink); padding:9px 34px 9px 14px; font-family:"Big Shoulders Display",sans-serif; font-weight:800; font-size:23px; text-transform:uppercase; letter-spacing:.02em; line-height:1; clip-path:polygon(0 0, calc(100% - 20px) 0, 100% 50%, calc(100% - 20px) 100%, 0 100%); filter:drop-shadow(0 8px 12px rgba(16,20,24,.35))}
.sign.r1{left:3px}
.sign.r3{left:3px; bottom:calc(26.5% + 24px)}
.sign.left{right:3px; clip-path:polygon(20px 0, 100% 0, 100% 100%, 20px 100%, 0 50%); padding:9px 14px 9px 34px; text-align:right}
.sign.l2{bottom:calc(26.5% + 89px)}
.sign small{display:block; font-family:"Barlow",sans-serif; font-weight:500; font-size:12.5px; text-transform:none; letter-spacing:0; margin-top:5px; line-height:1.3}
@media (max-width:820px){ .bivio{height:520px} .signpost{left:38%} .sign{font-size:18px; padding:8px 26px 8px 10px; max-width:52vw} .sign.left{padding:8px 10px 8px 26px} .sign small{font-size:11px} .pole{height:200px} .sign{bottom:calc(26.5% + 132px)} .sign.l2{bottom:calc(26.5% + 76px)} .sign.r3{bottom:calc(26.5% + 20px)} }
