<!doctype html><html><head><meta charset=utf-8><link rel=stylesheet href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800&family=Barlow:wght@500&display=swap"><style>:root{--accent:#ffb300;--ink:#101418;--ink-2:#4c5866;--shadow:0 22px 44px -22px rgba(16,20,24,.28)}body{margin:0;padding:20px;background:#e9eef4;font-family:Barlow}.wrap{max-width:1180px;margin:0 auto}/* il bivio: la pista vista dagli occhi dello sciatore */
.bivio-intro{text-align:center; max-width:56ch; margin:0 auto 26px}
.bivio-intro p{color:var(--ink-2)}
.bivio{position:relative; height:min(64vh,620px); min-height:440px; border-radius:22px; overflow:hidden; background:#d5e3f1; box-shadow:var(--shadow)}
.bivio .scene{position:absolute; inset:0; width:100%; height:100%; display:block}
.bivio-caps{list-style:none; margin:22px 0 0; padding:0; display:grid; grid-template-columns:repeat(3,1fr); gap:18px}
.bivio-caps li{font-size:15px; color:var(--ink-2); border-top:3px solid var(--accent); padding-top:10px}
.bivio-caps b{display:block; font-family:"Big Shoulders Display",sans-serif; font-weight:800; font-size:22px; text-transform:uppercase; color:var(--ink); margin-bottom:2px}
@media (max-width:820px){ .bivio{height:52vh} .bivio-caps{grid-template-columns:1fr; gap:12px} }
